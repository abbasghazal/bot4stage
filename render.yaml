services:
  - type: web
    name: telegram-education-bot
    runtime: python
    repo: https://github.com/yourusername/your-repo-name
    branch: main
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "import threading; from web_server import run_web_server; threading.Thread(target=run_web_server, daemon=True).start(); import main; main.main()"
    disk:
      name: telegram-bot-data
      mountPath: /opt/render/data
      sizeGB: 1
    autoDeploy: true
